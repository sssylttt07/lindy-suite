<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Lindy Air V1.1.6-gre · 面板 / 折叠栏 / 面具 / User 配置</title>
<style>
:root{
  --bg:linear-gradient(160deg,#15151c 0%,#101014 100%) fixed;
  --panel:#1f1f27;--panel2:#2a2a34;--line:#34343e;
  --text:#e8e8ea;--dim:#99989e;--accent:#b8b8bf;--accent2:#d6d6dc;--danger:#c76a6a;
  --caps:#242427;--capline:rgba(255,255,255,.07);--soft:rgba(255,255,255,.06);
  --field:#26262e;--mask:rgba(8,8,10,.5);--shadow:0 10px 30px rgba(0,0,0,.5);
  --brand1:#6535D4;--brand2:#37C89A;--nights:#14121D;--paper:#FAFAFC;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,"Courier New",monospace;
}
body[data-theme="graphite"]{--bg:linear-gradient(160deg,#15151c 0%,#101014 100%) fixed}
body[data-theme="warmnight"]{--bg:linear-gradient(160deg,#171210 0%,#130f0d 100%) fixed;
  --panel:#241c16;--panel2:#322921;--line:#453a30;--text:#f2e9e0;--dim:#bda490;
  --accent:#e0a96f;--accent2:#ecc394;--caps:#2d241e;--capline:rgba(255,255,255,.07);
  --soft:rgba(255,255,255,.06);--field:#2f2620;--mask:rgba(12,8,5,.45);--shadow:0 10px 30px rgba(0,0,0,.5)}
body[data-theme="pine"]{--bg:linear-gradient(160deg,#0e1513 0%,#0b1110 100%) fixed;
  --panel:#1a2823;--panel2:#26332d;--line:#33403a;--text:#e4f0ea;--dim:#8aa79b;
  --accent:#6fd1ab;--accent2:#9be0c4;--caps:#1d2c26;--capline:rgba(255,255,255,.07);
  --soft:rgba(255,255,255,.06);--field:#223028;--mask:rgba(5,12,10,.45);--shadow:0 10px 30px rgba(0,0,0,.45)}
body[data-theme="mibai"]{--bg:linear-gradient(160deg,#f7f4ec 0%,#efeade 100%) fixed;
  --panel:#fffdf6;--panel2:#f3eee2;--line:#ddd5c4;--text:#3a352b;--dim:#8a8168;
  --accent:#8a6d3b;--accent2:#a5854e;--caps:#fffdf6;--capline:#ddd5c4;
  --soft:rgba(0,0,0,.05);--field:#f6f2e8;--mask:rgba(60,54,40,.35);--shadow:0 10px 26px rgba(60,54,40,.18)}
body[data-theme="mist"]{--bg:linear-gradient(160deg,#f4f7fb 0%,#e8eef6 100%) fixed;
  --panel:#ffffff;--panel2:#eef3f9;--line:#d6dfea;--text:#2a3440;--dim:#6f7d8d;
  --accent:#3a6ea8;--accent2:#5a8ac4;--caps:#ffffff;--capline:#d6dfea;
  --soft:rgba(0,0,0,.05);--field:#f1f5fa;--mask:rgba(40,52,64,.35);--shadow:0 10px 26px rgba(40,52,64,.18)}
body[data-theme="shusui"]{--bg:linear-gradient(160deg,#f6f8f4 0%,#eaefe6 100%) fixed;
  --panel:#ffffff;--panel2:#eff4ec;--line:#d9e0d4;--text:#2f332c;--dim:#727a6c;
  --accent:#5f7a5a;--accent2:#4a6147;--caps:#f7f8f4;--capline:#d9e0d4;
  --soft:rgba(0,0,0,.05);--field:#f2f6ef;--mask:rgba(47,51,44,.35);--shadow:0 10px 26px rgba(47,51,44,.18)}

*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:var(--sans);background:var(--bg);color:var(--text);
  font-size:14px;line-height:1.6;overflow-wrap:break-word;
  padding:0 0 calc(106px + env(safe-area-inset-bottom,0px));}
button{font:inherit;color:inherit}
h2,h3{margin:0}

/* ---------- App Bar ---------- */
.bar{position:sticky;top:0;z-index:60;display:flex;align-items:center;gap:8px;
  padding:calc(11px + env(safe-area-inset-top,0px)) 12px 11px;background:var(--caps);border-bottom:1px solid var(--capline);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.mark{flex:0 0 auto;width:26px;height:26px;display:block}
.mark svg{display:block;width:26px;height:26px}
.brand{display:flex;align-items:baseline;gap:8px;min-width:0;flex:1 1 auto;overflow:hidden}
.brand h1{margin:0;font-size:13.5px;font-weight:700;letter-spacing:.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:baseline;gap:.45em}
.brand h1 .mn{font-weight:700}
.brand h1 .tail{color:var(--dim);font-weight:400;font-size:.7em;letter-spacing:.04em;margin-left:0}
.brand .ver{font-size:11px;font-weight:700;color:var(--caps);background:linear-gradient(135deg,var(--brand1),var(--brand2));border-radius:6px;padding:2px 8px;align-self:center;white-space:nowrap;letter-spacing:.3px}
.bar .sp{flex:0 0 0}
.ghost{height:30px;padding:0 11px;border-radius:16px;border:1px solid var(--line);
  background:var(--field);font-size:12.5px;font-weight:700;cursor:pointer;
  white-space:nowrap;flex:0 0 auto}
.ghost:active{transform:scale(.96)}
.ghost.danger{border-color:var(--accent);color:var(--accent);background:var(--soft)}
.dots{display:flex;gap:4px;align-items:center}
.dots button{width:18px;height:18px;padding:0;border-radius:50%;cursor:pointer;
  border:1px solid var(--capline);background:transparent;position:relative}
.dots button i{position:absolute;inset:3px;border-radius:50%;display:block}
.dots button[aria-pressed="true"]{border-color:var(--accent)}
.dots button[aria-pressed="true"]::after{content:"";position:absolute;inset:-3px;border-radius:50%;
  border:1px solid var(--accent)}
.icbtn{width:30px;height:30px;padding:0;border-radius:50%;border:1px solid var(--line);
  background:var(--field);color:var(--text);display:flex;align-items:center;justify-content:center;
  cursor:pointer;flex:0 0 auto}
.icbtn svg{width:15px;height:15px}
.icbtn:active{transform:scale(.94)}
.palettePop{display:none;position:absolute;right:12px;top:calc(100% + 6px);z-index:70;
  background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:10px 12px 8px;
  box-shadow:0 10px 30px rgba(0,0,0,.45)}
.palettePop.open{display:block}
.palettePop .popovl{display:flex;align-items:center;gap:8px;font-size:10px;font-weight:800;
  letter-spacing:.08em;color:var(--dim);margin:0 0 8px}
.palettePop .popovl .pthm{margin-left:auto;font-weight:600;color:var(--text);font-size:10px;
  background:var(--soft);border-radius:10px;padding:2px 8px;letter-spacing:.02em}
.palettePop .dots{gap:14px;padding:2px 2px 4px}
.palettePop .dots button{width:22px;height:22px;border-width:1.5px}
.palettePop .dots button i{inset:3.5px}
@media (max-width:520px){.bar{gap:6px}.ghost{padding:0 9px}}

/* ---------- 页面 ---------- */
main{padding:12px 12px 0;max-width:560px;margin:0 auto}
.page[hidden]{display:none}
.sec{background:var(--panel);border:1px solid var(--line);border-radius:14px;
  padding:12px 13px;margin:0 0 12px}
.sec>h2{font-size:13.5px;font-weight:800;letter-spacing:.2px;display:flex;align-items:center;gap:7px}
.sec>h2 em{font-style:normal;font-size:10.5px;font-weight:600;color:var(--dim);
  background:var(--soft);border-radius:7px;padding:1px 7px}
.sec>p{margin:5px 0 0;font-size:12px;color:var(--dim);line-height:1.55}
.sec>.bd{margin-top:10px}
.note{margin:9px 0 0;padding:8px 10px;border-radius:10px;background:var(--soft);
  font-size:11.5px;color:var(--dim);line-height:1.6}
.note b{color:var(--text)}

/* ---------- 控件 ---------- */
/* 面具编辑器编辑行 */
.mrow{display:flex;gap:6px;align-items:flex-start;flex-wrap:wrap}
.mrow+.mrow{margin-top:7px}
.mrow .rl{flex:0 0 auto;font-size:11.5px;color:var(--dim);line-height:32px;min-width:44px;text-align:right}
.mrow input[type=text],.mrow input[type=number]{width:auto;flex:1 1 104px;min-width:0;height:32px;
  padding:0 9px;border-radius:9px;font-size:12.5px;font-family:inherit;color:var(--text);
  background:var(--field);border:1px solid var(--line);outline:none}
.mrow input.fl{flex:0 0 86px;width:86px}
.mrow input.num{flex:0 0 50px;width:50px;text-align:center;padding:0 3px}
.mrow input.plc{flex:1 1 70px}
.mrow input:focus,.mrow textarea:focus{border-color:var(--accent)}
.mrow.cell{display:grid;grid-template-columns:42px 1fr 1fr 1fr 1.5fr 30px;gap:6px;align-items:center}
.mrow.cell .rl{grid-column:1;min-width:0;text-align:right;font-size:11px;line-height:1.4;padding-top:9px}
.mrow.cell input.num,.mrow.cell input.plc{width:100%;flex:none}
.mrow.cell input.vl{grid-column:2/6;grid-row:2;width:100%;flex:none}
.mrow textarea{flex:1 1 200px;width:auto;min-height:52px;font-size:12.5px}
.delb{flex:0 0 auto;width:30px;height:32px;padding:0;border-radius:9px;border:1px solid var(--line);
  background:var(--field);color:var(--dim);font-size:12px;cursor:pointer}
.delb:active{transform:scale(.94)}
.addb{width:100%;margin-top:9px;height:36px;border-radius:11px;border:1px dashed var(--line);
  background:transparent;color:var(--dim);font-size:12px;font-weight:700;cursor:pointer}
.mrow select{flex:1 1 auto;min-width:0;height:32px;border-radius:9px;border:1px solid var(--line);
  background:var(--field);color:var(--text);font-size:12.5px;font-family:inherit;padding:0 7px;outline:none}
.mrow select:focus{border-color:var(--accent)}
.btn2{flex:0 0 auto;height:32px;padding:0 13px;border-radius:9px;border:1px solid var(--line);
  background:var(--field);color:var(--text);font-size:12px;font-weight:800;cursor:pointer;
  font-family:inherit;white-space:nowrap}
.btn2.pri{border:0;background:linear-gradient(135deg,#6535D4,#37C89A);color:#fff}
.btn2:active{transform:scale(.96)}
.card.foldrow{cursor:default}
.edt{flex:0 0 auto;height:28px;padding:0 11px;border-radius:14px;border:1px solid var(--line);
  background:var(--field);color:var(--dim);font-size:11.5px;font-weight:800;cursor:pointer;font-family:inherit}
.edt:active{transform:scale(.95)}
#fsBtn{position:fixed;left:50%;transform:translateX(-50%);z-index:996;padding:7px 15px;
  font-size:12px;font-weight:800;border-radius:17px;background:var(--panel);border:1px solid var(--accent);
  color:var(--accent);cursor:pointer;font-family:inherit;box-shadow:0 6px 22px rgba(0,0,0,.5);
  bottom:calc(84px + env(safe-area-inset-bottom,0px))}
#fsBtn[hidden]{display:none}
#fsBtn:active{transform:translateX(-50%) scale(.95)}
#fsModal{position:fixed;top:0;left:0;right:0;bottom:0;z-index:999}
#fsModal[hidden]{display:none}
#fsModal .bd{position:absolute;top:0;left:0;right:0;bottom:0;border:0;padding:0;cursor:default;
  background:var(--mask);backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px)}
#fsModal .box{position:absolute;display:flex;flex-direction:column;background:var(--panel);
  border:1px solid var(--line);border-radius:14px;box-shadow:0 18px 60px rgba(0,0,0,.55);overflow:hidden}
#fsModal.half .box{left:3vw;top:6vh;width:94vw;height:82vh}
#fsModal.full .box{left:0;top:0;width:100vw;height:100vh;border-radius:0;border:0}
@media(min-width:900px){#fsModal.half .box{left:15vw;top:12vh;width:70vw;height:76vh}}
#fsModal .hd{display:flex;align-items:center;gap:7px;padding:9px 11px;border-bottom:1px solid var(--line)}
#fsModal .hd .ti{flex:1;min-width:0;font-size:12.5px;color:var(--accent);font-weight:700;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#fsModal .hd button{flex:0 0 auto;height:30px;padding:0 11px;border-radius:15px;border:1px solid var(--line);
  background:var(--field);color:var(--text);font-size:12px;font-weight:700;cursor:pointer;font-family:inherit}
#fsModal .hd button.pri{border:0;background:linear-gradient(135deg,#6535D4,#37C89A);color:#fff}
#fsModal .hd button:active{transform:scale(.95)}
#fsModal textarea{flex:1;min-height:0;width:100%;resize:none;border:0;border-radius:0;
  background:transparent;color:var(--text);padding:14px;font-size:15px;line-height:1.9;font-family:inherit}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid2>*{min-width:0}
.row{display:flex;align-items:center;gap:9px;padding:9px 10px;border-radius:11px;
  background:var(--field);border:1px solid var(--line)}
.row .nm{flex:1;min-width:0;font-size:12.5px;font-weight:600;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.tag{font-size:10px;font-weight:700;color:var(--dim);border:1px solid var(--line);
  border-radius:6px;padding:0 5px;line-height:15px;flex:0 0 auto}
.sw{flex:0 0 auto;width:40px;height:23px;border-radius:12px;border:1px solid var(--line);
  background:var(--panel2);position:relative;cursor:pointer;padding:0}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:17px;height:17px;border-radius:50%;
  background:var(--dim);transition:transform .16s ease,background .16s ease}
.sw[aria-pressed="true"]{background:var(--accent);border-color:var(--accent)}
.sw[aria-pressed="true"]::after{transform:translateX(17px);background:var(--panel)}
.sw:disabled{opacity:.5;cursor:not-allowed}

.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{min-height:34px;padding:0 13px;border-radius:17px;border:1px solid var(--line);
  background:var(--field);font-size:12.5px;font-weight:700;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--soft);border-color:var(--accent);color:var(--text)}
.chip:disabled{opacity:.45;cursor:not-allowed}
.tierc{flex:1;min-width:56px;text-align:center}

.lenc{display:flex;flex-direction:column;gap:3px;align-items:flex-start;text-align:left;
  padding:9px 11px;border-radius:12px;border:1px solid var(--line);background:var(--field);
  cursor:pointer;flex:1;min-width:0}
.lenc strong{font-size:13px;white-space:nowrap}
.lenc span{font-size:10.5px;color:var(--dim);line-height:1.45}
.lenc[aria-pressed="true"]{background:var(--soft);border-color:var(--accent)}
.chips.lens{flex-direction:column;gap:8px}
.chips.lens .lenc{width:100%;flex:0 0 auto}

.sws{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;justify-items:center}
.sws button{width:34px;height:34px;border-radius:10px;border:2px solid var(--capline);
  padding:0;cursor:pointer;position:relative}
.sws button[aria-pressed="true"]{border-color:var(--text);box-shadow:0 0 0 2px var(--soft)}

input[type=text],textarea{width:100%;background:var(--field);border:1px solid var(--line);
  border-radius:10px;color:var(--text);padding:9px 11px;font:inherit;font-size:12.5px}
textarea{min-height:86px;resize:vertical;line-height:1.6}
html{-webkit-tap-highlight-color:transparent}
:focus,:focus-visible{outline:none}

/* ---------- 折叠栏 ---------- */
.search{display:flex;gap:8px;align-items:center;position:sticky;top:var(--barh,52px);z-index:40;
  background:var(--bg);padding:0 0 10px}
.search input{flex:1}
.grp{margin:0 0 12px}
.grp>.gh{display:flex;align-items:center;gap:8px;padding:2px 2px 8px;
  font-size:12.5px;font-weight:800;color:var(--text)}
.grp>.gh i{font-style:normal;color:var(--dim);font-weight:600;font-size:11px}
.card{display:flex;align-items:center;gap:9px;width:100%;text-align:left;
  padding:10px 11px;border-radius:12px;background:var(--panel);border:1px solid var(--line);
  margin:0 0 7px;cursor:pointer}
.card .e{flex:0 0 auto;font-size:16px;line-height:1}
.card .t{flex:1;min-width:0;font-size:12.5px;font-weight:700;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.card .t small{display:block;font-weight:500;color:var(--dim);font-size:10.5px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card[data-on="1"]{border-color:var(--accent)}

/* ---------- 底栏（家族锁死几何） ---------- */
.dock{position:fixed;left:14px;right:14px;bottom:calc(14px + env(safe-area-inset-bottom,0px));
  height:58px;border-radius:29px;background:var(--caps);border:1px solid var(--capline);
  padding:0 7px;display:flex;align-items:center;gap:4px;z-index:70;
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:var(--shadow)}
.dock .tab{flex:1;min-width:0;height:44px;border-radius:22px;border:0;background:transparent;
  color:var(--dim);display:flex;align-items:center;justify-content:center;gap:5px;
  font-size:11.5px;font-weight:700;cursor:pointer}
.dock .tab svg{flex:0 0 auto;width:20px;height:20px;stroke-width:1.8}
.dock .tab[aria-selected="true"]{background:var(--soft);color:var(--text)}
.dock .eye{flex:0 0 auto;width:46px;height:46px;border-radius:50%;border:0;margin-left:2px;
  background:linear-gradient(135deg,#6535D4,#37C89A);display:flex;align-items:center;
  justify-content:center;cursor:pointer;padding:0}
.dock .eye svg{width:20px;height:20px}
.dock .eye:active{transform:scale(.94)}
.dock .eye[aria-pressed="true"]{outline:2px solid var(--brand1);outline-offset:2px}

/* ---------- 遮罩 / 抽屉 ---------- */
.scrim{position:fixed;inset:0;background:var(--mask);backdrop-filter:blur(4px);
  -webkit-backdrop-filter:blur(4px);z-index:990;border:0;padding:0}
.scrim[hidden]{display:none}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:997;background:var(--panel);
  border-top:1px solid var(--line);border-radius:18px 18px 0 0;max-height:82vh;
  display:flex;flex-direction:column;box-shadow:var(--shadow)}
.sheet[hidden]{display:none}
.sheet-hd{display:flex;align-items:center;gap:10px;padding:13px 14px 10px;
  border-bottom:1px solid var(--line);font-size:13px;font-weight:800}
.sheet-hd span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.x{flex:0 0 auto;width:32px;height:32px;border-radius:50%;border:1px solid var(--line);
  background:var(--field);cursor:pointer;font-size:13px;line-height:1}
.sheet-bd{padding:12px 14px calc(20px + env(safe-area-inset-bottom,0px));
  overflow:auto;-webkit-overflow-scrolling:touch}
.sheet-bd h4{margin:14px 0 6px;font-size:12px;color:var(--dim);font-weight:800}
.sheet-bd h4:first-child{margin-top:0}

/* ---------- 预览/导出 ---------- */
.pv{position:fixed;left:0;right:0;top:0;bottom:calc(80px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--bg);display:flex;flex-direction:column}
.pv[hidden]{display:none}
/* V1.1.4-exp 预览打开时锁背景：藏编辑页 + 禁背景滚动，防 dock 缝隙误触 */
html.pvon{overflow:hidden}
html.pvon body main{visibility:hidden}
.pv-hd{display:flex;align-items:center;gap:10px;padding:calc(11px + env(safe-area-inset-top,0px)) 14px 11px;
  background:var(--caps);border-bottom:1px solid var(--capline);font-size:14px;font-weight:800}
.pv-hd b{flex:1;min-width:0}
.pv-hd span{font-size:11px;font-weight:600;color:var(--dim)}
.pv-bd{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;padding:14px;padding-bottom:18px;
  max-width:560px;width:100%;margin:0 auto;overscroll-behavior:contain}
.phone{border:1px solid var(--line);border-radius:22px;padding:20px 14px;
  background:linear-gradient(180deg,#141a2c,#0d1120);box-shadow:0 18px 40px rgba(0,0,0,.35)}
.chat{min-height:300px;background:radial-gradient(rgba(255,255,255,.03) 1px,transparent 1px);
  background-size:14px 14px;border-radius:14px;padding:14px}
body[data-theme="mibai"] .phone,body[data-theme="mist"] .phone,body[data-theme="shusui"] .phone{
  border-color:#c6c9cc;box-shadow:0 12px 30px rgba(80,90,110,.16)}
.pv-ops{display:flex;gap:9px;margin:14px 0}
.pv-ops button{flex:1;height:44px;border-radius:22px;border:1px solid var(--line);
  background:var(--field);font-size:13px;font-weight:800;cursor:pointer}
.pv-ops button.primary{background:linear-gradient(135deg,#6535D4,#37C89A);border:0;color:#fff}
.pv-ops button:active{transform:scale(.97)}
.pv-text{margin:0;background:var(--panel);border:1px solid var(--line);border-radius:12px;
  padding:12px;font-family:var(--mono);font-size:11px;line-height:1.65;color:var(--dim);
  white-space:pre-wrap;word-break:break-word;max-height:46vh;overflow:auto}

/* ---------- toast ---------- */
.toast{position:fixed;left:50%;transform:translateX(-50%);
  bottom:calc(88px + env(safe-area-inset-bottom,0px));z-index:999;
  background:var(--caps);border:1px solid var(--capline);color:var(--text);
  border-radius:14px;padding:9px 15px;font-size:12.5px;font-weight:600;
  box-shadow:var(--shadow);max-width:86vw;text-align:center}
.toast[hidden]{display:none}

.hgrid{display:grid;grid-template-columns:auto auto;gap:6px;align-items:center;flex:0 0 auto}

/* ==================== 颜色工具 ==================== */

function hexToHsl(hex){
  var m=/^#?([0-9a-f]{6})$/i.exec(String(hex||'').trim());
  if(!m) return {h:220,s:0.5,l:0.2};
  var n=parseInt(m[1],16), r=((n>>16)&255)/255, g=((n>>8)&255)/255, b=(n&255)/255;
  var mx=Math.max(r,g,b), mn=Math.min(r,g,b), d=mx-mn, h=0;
  if(d){
    if(mx===r) h=((g-b)/d)%6;
    else if(mx===g) h=(b-r)/d+2;
    else h=(r-g)/d+4;
    h*=60; if(h<0) h+=360;
  }
  var l=(mx+mn)/2;
  var s=d? d/(1-Math.abs(2*l-1)) : 0;
  return {h:h,s:s,l:l};
}
function hslToHex(h,s,l){
  h=((h%360)+360)%360; s=Math.max(0,Math.min(1,s)); l=Math.max(0,Math.min(1,l));
  var c=(1-Math.abs(2*l-1))*s, x=c*(1-Math.abs((h/60)%2-1)), m=l-c/2, r,g,b;
  if(h<60){r=c;g=x;b=0;} else if(h<120){r=x;g=c;b=0;}
  else if(h<180){r=0;g=c;b=x;} else if(h<240){r=0;g=x;b=c;}
  else if(h<300){r=x;g=0;b=c;} else {r=c;g=0;b=x;}
  function f(v){ var t=Math.round((v+m)*255); if(t<0)t=0; if(t>255)t=255; return t.toString(16).padStart(2,'0'); }
  return '#'+f(r)+f(g)+f(b);
}
function rgba(hex,a){
  var m=/^#?([0-9a-f]{6})$/i.exec(String(hex||'').trim());
  if(!m) return 'rgba(24,42,82,'+a+')';
  var n=parseInt(m[1],16);
  return 'rgba('+((n>>16)&255)+','+((n>>8)&255)+','+(n&255)+','+a+')';
}
function esc(s){
  return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function smartPalette(baseHex,mode){
  var M=SMART2[mode]||SMART2.clash;
  var c=hexToHsl(baseHex), h=c.h, s=c.s, l=c.l, dark=l<0.25;
  var bgL=dark?0.22:0.135;
  return {
    bg:      hslToHex(h, s*0.75, Math.max(0.06,bgL)),
    border:  hslToHex(h+M.border.dh, s*Math.min(1,M.border.s/Math.max(0.25,s)), M.border.l),
    label:   hslToHex(h+M.label.dh,  M.label.s*(s<0.08?0.06:1), M.label.l),
    value:   hslToHex(h, s*0.16, 0.93),
    filled:  hslToHex(h+M.filled.dh, M.filled.s*(s<0.08?0.06:1), M.filled.l),

function buildPrompt(liteFolds){
  var lc=lenCfg(), c=colors();

  var L=[];

  /* 唯一一级标题：{{char}} 回复偏好。回复格式、面板、气泡、折叠栏的规则全部以序号叠在它下面 */

  if(String(m.pref).trim()) L.push(String(m.pref).trim());

    : '2. 包裹：整条回复用 <plot> 和 </plot> 包住，plot 内不能有空行，plot 外不输出任何文字、解释或代码块标记。');
  L.push('3. 结构：'+(tavo
    ? '顺序固定为 面板 → 分界线 → 正文（旁白＋台词），不得颠倒、不得省略任何一层；同一条回复只输出这一套，不另创样式。'
    : '先输出面板，再输出对话气泡，顺序不得颠倒；同一条回复只输出这一套面板＋气泡，不另创样式。')
    + items.map(function(i){ return '【'+(i.slot||i.label)+'】'; }).join('') + ' 等文字槽位按剧情填写；'
    + (bars.length? '数值条按第 4 条规则生成；' : '') + '【百分比%】填当前数值。');

        +'，百分比取 5 的倍数；点亮格数＝百分比×'+cellN+'÷100（四舍五入），例如 60%＝6 个专属 emoji＋4 个 '

        +'相同数值的历史回复保持同样的格数，相邻回复点亮格数变化不超过 ±2 格，重大剧情节点除外。');
      L.push('   各条专属 emoji：'+bars.map(function(b){ return b+'＝'+(BAR_EMOJI[b]||cBarEmoji(b)||'🔸'); }).join('、')+'。');
    } else {
      L.push('   数值条规则：每条数值用 '+cellN+' 格符号条表示，实心在前、空心在后，百分比取 5 的倍数；'

  } else {

    L.push(bubbleHTML());
  }

  /* 折叠栏总则 + 逐卡编号项 */
  if(ons.length){
    L.push('');
    L.push(no+'. 折叠栏总则（共 '+ons.length+' 张，必须按下面给出的顺序输出）：');
    L.push('   输出顺序：'+ons.map(function(f,i){ return (i+1)+'. '+(f.rot?'【轮换】':'')+foldTitle(f); }).join(' → '));
    var rot=ons.filter(function(f){ return f.rot; });

      +'；与其它轮换卡合计每轮挑1-2张输出，别全上。');
    L.push('   每张卡：HTML 结构与样式原样保留，只替换其中的文字内容；每轮更新，禁止照抄示例；禁止留空占位符；禁止删改或省略已有记录。');

    no++;
    if(liteFolds){
      L.push('');
      L.push('结构模板（所有折叠卡统一此结构，只替换标题与内容行，样式逐字保留）：');
      L.push(foldSkeleton());

    }

  /* 收尾编号项：禁止项 */
  L.push('');

  GLOBAL_BANS.forEach(function(r,i){ L.push('   '+(i+1)+') '+r); });

  /* {{char}} 指令章节：置于格式规则之后，避免格式规则落在二级标题内部 */
  var ins=numberedLines(m.instr);
  if(ins.length) L.push('\n## {{char}}回复指令：\n'+ins.join('\n'));

  /* 第二个一级标题：{{user}} 设定（原样保留，编号已自动生成） */
  var mk=maskText(true, true);
  if(mk){ L.push(''); L.push('# {{user}}设定：'); L.push(mk); }

  return L.join('\n');
}

var LITE_ACTIVE=false, liteToast={on:null,at:0};
function notifyLite(on){
  LITE_ACTIVE=on;
  var now=Date.now();
  if(liteToast.on===on && now-liteToast.at<3000) return;
  liteToast={on:on,at:now};
  if(on) toast('检测到字数超多，已切换轻量模式');
}
function promptText(){
  var full=buildPrompt(false);

}

/* ==================== V0.0.1 骰子版：分库随机抽词 ==================== */
/* 分库维度：世界观（年龄/信息素库）×题材（22 题材独立库）×性别（male/female·hair/hair_F·per/per_F）×
   身份高低（iden/iden_B·bg/bg_B）×ABO（信息素 Alpha/Beta/Omega×世界观）。每库恰好 100 条。 */
function diceLib(){
  var d=S.mask.dice||{}, w=DICE_DATA2[d.world];
  return { d:d, w:w||null, sc:(w&&d.scene)?(w.scenes[d.scene]||null):null };
}
function dicePick(a){ return a[Math.floor(Math.random()*a.length)]; }
function diceRoll(f, pk){
  var L=diceLib(), d=L.d, w=L.w, sc=L.sc, v='';
  if(!w){ toast('先选世界观'); return ''; }
  var g=d.gender, t=d.tier;
  if(f==='age'){
    v=dicePick(DICE_AGE2[d.world]||['不详']);
  } else if(f==='scent'){
    var sl;
    if(d.abo==='Beta') sl=DICE_SCENT2.Beta[d.world];
    else if(d.abo==='Omega') sl=DICE_SCENT2.Omega[d.world];
    else if(d.abo==='Alpha') sl=DICE_SCENT2.Alpha[d.world];
    else sl=(DICE_SCENT2.Alpha[d.world]||[]).concat(DICE_SCENT2.Omega[d.world]||[]);
    if(!sl || !sl.length){ toast('该世界观没有信息素词库'); return ''; }
    v=dicePick(sl);
  } else if(f==='ex'){
    var libs=DICE_EXTRA[d.world];
    if(!libs){ toast('先选世界观'); return ''; }
    var pool;
    if(pk==='pet'){
      pool=[dicePick(libs.petType||['？'])+'，名叫'+dicePick(libs.petName||['？'])+'，'+dicePick(libs.petTrait||['？'])];
    } else if(pk==='skill'){
      if(!sc){ toast('先选题材'); return ''; }
      pool=(libs.skill&&libs.skill[d.scene])||[];
    } else pool=libs[pk]||[];
    if(!pool.length){ toast('该世界观没有这个字段的词库'); return ''; }
    v=dicePick(pool);
  } else {
    if(!sc){ toast('先选题材'); return ''; }
    if(f==='name'){
      var np=(g==='男')?sc.maleNames:(g==='女')?sc.femaleNames:sc.maleNames.concat(sc.femaleNames);
      v=dicePick(np);
    } else if(f==='look'){
      var hb=(g==='女')?sc.hair_F:(g==='男')?sc.hair:sc.hair.concat(sc.hair_F);
      var ab=(g==='女')?sc.attire_F:(g==='男')?sc.attire:sc.attire.concat(sc.attire_F);
      v=dicePick(hb)+'；'+dicePick(ab);
    } else if(f==='per'){
      var pp=(g==='女')?sc.per_F:(g==='男')?sc.per:sc.per.concat(sc.per_F);
      v=dicePick(pp);
    } else if(f==='bg'){
      var bb=(t&&w.tier[1]===t)?sc.bg_B:((t&&w.tier[0]===t)?sc.bg:sc.bg.concat(sc.bg_B));
      v=dicePick(bb);
    } else if(f==='job'){
      var jb=(t&&w.tier[0]===t)?sc.iden:((t&&w.tier[1]===t)?sc.iden_B:sc.iden.concat(sc.iden_B));
      v=dicePick(jb);
    }
  }
  return v;
}

/* ==================== V0.0.1 骰子版：亲属／好友骰子 ==================== */
/* 称谓库与称呼库为通用 200；现状／交情按世界观×身份高低（A/B）各 200；
   姓名复用当前题材的姓名库，并按称谓性别自动取男库／女库／合并 */
function roleSex(role){
  if(/父|兄|弟|叔|伯|舅|侄|甥|爷|公|哥|郎/.test(role)) return '男';
  if(/母|姊|姐|妹|姑|姨|奶|婆|娘/.test(role)) return '女';
  return '';
}
function diceExtraRoll(i,f){
  var ex=S.mask.extra[i]; if(!ex) return;
  var L2=diceLib(), d=L2.d, w=L2.w, sc=L2.sc;
  var tierKey='';
  if(w){ if(d.tier===w.tier[0]) tierKey='A'; else if(d.tier===w.tier[1]) tierKey='B'; }
  var pickName=function(){
    if(!w){ toast('先选世界观'); return ''; }
    if(!sc){ toast('先选题材'); return ''; }
    var sex=roleSex(String((ex.kind==='rel'?ex.rel:ex.fr).role||''));
    var pool=sex==='男'?sc.maleNames:sex==='女'?sc.femaleNames:sc.maleNames.concat(sc.femaleNames);
    return dicePick(pool);
  };
  var tierPool=function(branch){
    var lib=w?(branch||{}):null;
    var pool=!lib?[]:(tierKey?lib[tierKey]:((lib.A||[]).concat(lib.B||[])));
    if(!pool || !pool.length){ toast('先选世界观'); return null; }
    return pool;
  };
  var v='';
  if(f==='erole') v=dicePick(DICE_REL.roles);
  else if(f==='ename') v=pickName();
  else if(f==='estatus'){ var p1=tierPool(DICE_REL.rel[d.world]); if(!p1) return; v=dicePick(p1); }
  else if(f==='frole') v=dicePick(DICE_REL.frRoles);
  else if(f==='fname') v=pickName();
  else if(f==='fbond'){ var p2=tierPool(DICE_REL.fr[d.world]); if(!p2) return; v=dicePick(p2); }
  if(!v) return;
  var tgt=(f.charAt(0)==='e')?ex.rel:ex.fr;
  var keyMap={erole:'role',ename:'name',estatus:'status',frole:'role',fname:'name',fbond:'bond'};
  tgt[keyMap[f]]=v;
  var pfx=(f.charAt(0)==='e')?'mkE':'mkF';
  var inpMap={erole:'r',ename:'n',estatus:'s',frole:'r',fname:'n',fbond:'s'};
  var inp=document.getElementById(pfx+i+inpMap[f]);
  if(inp) inp.value=v;
  save();
}

function userBodyHTML(){

    +'<div style="color:'+c.value+';font-size:13.5px;line-height:1.9;text-align:left;margin:8px 0;">'+TXT+'</div>';
  var b=S.bubble;

  return '<div style="background-color:'+c.bg+';background-color:'+rgba(c.bg,b.alpha/100)+';'
    +(b.borderless?'border:none;':'border:1px solid '+bc(c)+';')
    +'border-radius:12px;padding:9px 13px;margin:8px 0;">'
    +'<div style="color:'+c.value+';font-size:13.5px;line-height:1.9;text-align:left;">'+TXT+'</div></div>';

function renderChrome(){
  document.body.setAttribute('data-theme',S.theme);
  var bd=document.getElementById('btnDice');
  if(bd) bd.setAttribute('aria-pressed',S.diceOn?'true':'false');
  var bu=document.getElementById('btnUserMode');
  if(bu) bu.setAttribute('aria-pressed',S.userOn?'true':'false');
  if(!S.userOn && S.sub==='user') S.sub='mask';
  var pn=document.getElementById('pthmName');
  if(pn){ var cur=null; for(var i=0;i<THEMES.length;i++){ if(THEMES[i].k===S.theme){ cur=THEMES[i]; break; } } if(cur) pn.textContent=cur.n; }
  Array.prototype.forEach.call(document.querySelectorAll('.dots button'),function(b){
    b.setAttribute('aria-pressed', b.getAttribute('data-k')===S.theme ? 'true':'false');
  });
  Array.prototype.forEach.call(document.querySelectorAll('.dock .tab'),function(b){
    b.setAttribute('aria-selected', b.getAttribute('data-goto')===S.sub ? 'true':'false');
    if(b.getAttribute('data-goto')==='user') b.style.display=S.userOn?'':'none';
  });
  ['panel','fold','mask','user'].forEach(function(p){
    var el=document.getElementById('pg'+p.charAt(0).toUpperCase()+p.slice(1));
    if(!el) return;
    if(p===S.sub) el.removeAttribute('hidden'); else el.setAttribute('hidden','');
  });
}

  var b=document.querySelector('.bar');
  if(b && b.offsetHeight) document.documentElement.style.setProperty('--barh', b.offsetHeight+'px');

function render(){
  var fsm=document.getElementById('fsModal');

function toast(msg){
  var t=document.getElementById('toast');
  t.textContent=msg; t.removeAttribute('hidden');
  clearTimeout(t._tm);
  t._tm=setTimeout(function(){ t.setAttribute('hidden',''); },1900);
}
function copyText(txt,okMsg){
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(function(){ toast(okMsg||'已复制提示词'); },
      function(){ fallbackCopy(txt,okMsg); });
  } else fallbackCopy(txt,okMsg);
}
function fallbackCopy(txt,okMsg){
  var ta=document.createElement('textarea');
  ta.value=txt; ta.style.position='fixed'; ta.style.left='-9999px';
  document.body.appendChild(ta); ta.select();
  try{ document.execCommand('copy'); toast(okMsg||'已复制提示词'); }
  catch(e){ toast('复制失败，请手动选择文本'); }
  document.body.removeChild(ta);
}
function download(){
  var cfg=Object.assign({_src:'air',_v:'1.1.6-gre'},S);
  if(cfg.sub==='user') cfg.sub='panel'; /* User 页码不进导出，避免 lite 导入后无此页 */
  var txt=promptText()+'\n\n---CONFIG---\n'+JSON.stringify(cfg,null,1);
  var blob=new Blob([txt],{type:'text/plain;charset=utf-8'});
  var a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='Lindy-Air_1.1.6-gre.txt';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(function(){ URL.revokeObjectURL(a.href); },3000);
  toast('已下载 .txt');
}

/* ---------- ⛶ 放大编辑：全屏 / 半屏，实时写回 ---------- */
var fsOrig=null;
function fsOK(el){
  if(!el || !el.tagName || !el.closest) return false;
  if(el.id==='q') return false;
  if(el.closest('#fsModal')) return false;
  if(el.tagName==='TEXTAREA') return true;
  if(el.tagName==='INPUT' && el.readOnly) return false;
  return el.tagName==='INPUT' && (el.type==='text' || el.type==='number');
}
function fsSync(){
  if(!fsOrig) return;
  if(!fsOrig.isConnected) return;
  fsOrig.value=document.getElementById('fsTa').value;
  fsOrig.dispatchEvent(new Event('input',{bubbles:true}));
}
function fsClose(){
  fsSync();
  document.getElementById('fsModal').setAttribute('hidden','');
  if(fsOrig && fsOrig.isConnected){ try{ fsOrig.focus(); }catch(e){} }
  fsOrig=null;
  document.getElementById('fsBtn').setAttribute('hidden','');
}
function fsOpen(el){
  fsOrig=el;
  document.getElementById('fsTi').textContent=el.getAttribute('aria-label')||'编辑内容';
  var ta=document.getElementById('fsTa');
  ta.value=el.value;
  var fm=document.getElementById('fsModal');
  fm.className='half'; fm.removeAttribute('hidden');
  document.getElementById('fsBtn').setAttribute('hidden','');
  setTimeout(function(){ ta.focus(); ta.setSelectionRange(ta.value.length,ta.value.length); },0);
}
document.addEventListener('focusin',function(e){
  if(!fsOK(e.target)) return;
  if(!document.getElementById('fsModal').hasAttribute('hidden')) return;
  fsOrig=e.target;
  document.getElementById('fsBtn').removeAttribute('hidden');
});
document.addEventListener('focusout',function(){
  setTimeout(function(){
    if(!document.getElementById('fsModal').hasAttribute('hidden')) return;
    if(!fsOK(document.activeElement)) document.getElementById('fsBtn').setAttribute('hidden','');
  },160);
});
document.addEventListener('dblclick',function(e){ if(fsOK(e.target)) fsOpen(e.target); });
document.getElementById('fsBtn').addEventListener('pointerdown',function(e){ e.preventDefault(); });
document.getElementById('fsBtn').addEventListener('click',function(){ if(fsOrig) fsOpen(fsOrig); });
document.getElementById('fsBd').addEventListener('click',fsClose);
document.getElementById('fsDone').addEventListener('click',fsClose);
document.getElementById('fsHalf').addEventListener('click',function(){ document.getElementById('fsModal').className='half'; });
document.getElementById('fsFull').addEventListener('click',function(){ document.getElementById('fsModal').className='full'; });
document.getElementById('fsTa').addEventListener('input',fsSync);

function togglePalette(){ /* V1.1.2：菜单锚定到主题按钮正下方（同侧） */
  var p=document.getElementById('palettePop'); if(!p)return;
  var willOpen=!p.classList.contains('open');
  p.classList.toggle('open');
  var b=document.getElementById('btnPalette');
  if(b)b.setAttribute('aria-expanded',willOpen?'true':'false');
  if(willOpen&&b){
    var r=b.getBoundingClientRect();
    p.style.position='fixed';
    p.style.top=Math.round(r.bottom+6)+'px';
    var w=p.offsetWidth||260, L=Math.round(r.left);
    if(L+w>window.innerWidth-10) L=window.innerWidth-10-w;
    p.style.left=Math.max(10,L)+'px';
    p.style.right='auto';
  }
}
document.getElementById('btnPalette').addEventListener('click',togglePalette);
function syncVerWidth(){ /* V1.1.0：版本号徽标宽度对齐 Lindy 单词（L 左缘—y 右缘），仅手机 */
  var mn=document.querySelector('.brand .mn'), v=document.querySelector('.brand .ver');
  if(!mn||!v) return;
  if(window.matchMedia('(max-width:899px)').matches){
    v.style.width=Math.ceil(mn.getBoundingClientRect().width)+'px';
  } else { v.style.width=''; }
}
